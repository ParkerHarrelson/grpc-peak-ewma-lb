name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build, test, check formatting
        run: ./mvnw -B verify

  # Timing-sensitive steering/ejection scenarios. Informational: shared runners can be noisy.
  harness-scenarios:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run perf-tagged scenarios
        run: ./mvnw -B install -DskipTests && ./mvnw -B -pl peak-ewma-harness test -Pperf
