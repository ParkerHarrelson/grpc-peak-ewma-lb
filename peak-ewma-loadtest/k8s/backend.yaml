# Headless Service + backend Deployment for the load test (#94). Clients resolve
# dns:///loadtest-backend.<namespace>.svc.cluster.local:9000 and get one address per pod.
# Change behaviour at runtime through each pod's admin port, e.g.
#   curl "http://<pod-ip>:8080/set?latencyFactor=5"
apiVersion: v1
kind: Service
metadata:
  name: loadtest-backend
  labels: {app: loadtest-backend}
spec:
  clusterIP: None
  selector: {app: loadtest-backend}
  ports:
    - {name: grpc, port: 9000, targetPort: 9000}
    - {name: admin, port: 8080, targetPort: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadtest-backend
  labels: {app: loadtest-backend}
spec:
  replicas: 6 # kind smoke; 20 for the Tier 2 default fleet
  selector:
    matchLabels: {app: loadtest-backend}
  template:
    metadata:
      labels: {app: loadtest-backend}
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: backend
          image: peak-ewma-loadtest:dev
          imagePullPolicy: IfNotPresent
          command:
            - java
            - -Xmx160m
            - -XX:+UseSerialGC
            - -cp
            - /app/loadtest.jar
            - dev.parkerharrelson.grpc.peakewma.loadtest.Backend
            - --ports
            - "9000"
            - --admin-port
            - "8080"
            - --bind
            - 0.0.0.0
            - --set
            - slots=8
          ports:
            - {name: grpc, containerPort: 9000}
            - {name: admin, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: 500m, memory: 256Mi}
